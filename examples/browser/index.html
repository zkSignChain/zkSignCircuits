<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>zksign browser example</title>
  </head>
  <body>
    <h1>zksign browser example</h1>
    <button id="gen">Generate Proof</button>
    <pre id="out"></pre>
    <script type="module">
      document.getElementById('gen')!.addEventListener('click', async () => {
        const out = document.getElementById('out')!;
        out.textContent = 'Not implemented in scaffold — build wasm and load via worker.';
      });
    </script>
  </body>
</html>
