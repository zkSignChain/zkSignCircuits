name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Setup pnpm
        run: npm i -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Cargo build
        run: cd cargo-workspace && cargo build --workspace --release
      - name: Build wasm (wasm-pack)
        run: |
          cd cargo-workspace/crates/zksign-wasm
          if ! command -v wasm-pack >/dev/null 2>&1; then cargo install wasm-pack || true; fi
          wasm-pack build --release --target bundler
      - name: Turbo tests
        run: pnpm -w turbo run test || true
      - name: Cargo tests
        run: cd cargo-workspace && cargo test --workspace
